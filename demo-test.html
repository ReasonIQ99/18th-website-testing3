<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:17px/1.6 Arial;background:#f1f5fb;color:#18283c;padding:20px;max-width:850px;margin:auto}article{background:white;padding:20px;border-radius:12px;margin:15px 0}label{display:block;padding:6px}button{background:#143867;color:white;border:0;padding:13px 20px;border-radius:7px;cursor:pointer}#timer{position:sticky;top:0;background:#ffd250;padding:10px}p{color:#425570}</style><title>Demo Practice Test</title></head><body><h1>ReasonIQ99 — Demo Test</h1><p>Five demonstration questions. Five minutes. One mark per correct answer; no negative marking. Results are not saved.</p><button id="start">Begin Test</button><div id="test" hidden><p id="timer"></p><form id="quiz"></form><button id="submit">Submit Test</button></div><div id="result" aria-live="polite"></div><script>
const questions=[{q:'What is 20% of 250?',o:['25','50','75','100'],a:1,e:'250 × 20 / 100 = 50.'},{q:'Find the next number: 2, 4, 8, 16, …',o:['18','24','32','36'],a:2,e:'Each term is multiplied by 2.'},{q:'What is the average of 10, 20 and 30?',o:['15','20','25','30'],a:1,e:'(10 + 20 + 30) / 3 = 20.'},{q:'A person faces north and turns right. Which direction now?',o:['South','West','East','North'],a:2,e:'A right turn from north points east.'},{q:'If 3 pens cost ₹30, how much do 5 pens cost at the same unit price?',o:['₹40','₹45','₹50','₹60'],a:2,e:'Each pen costs ₹10; five cost ₹50.'}];let timer,end,done=false;const $=s=>document.querySelector(s);$('#start').onclick=()=>{$('#start').hidden=true;$('#test').hidden=false;questions.forEach((x,i)=>{const a=document.createElement('article');const h=document.createElement('h3');h.textContent=(i+1)+'. '+x.q;a.append(h);x.o.forEach((o,j)=>{const l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;l.append(r,document.createTextNode(' '+o));a.append(l)});$('#quiz').append(a)});end=Date.now()+300000;tick();timer=setInterval(tick,500)};function tick(){const s=Math.max(0,Math.ceil((end-Date.now())/1000));$('#timer').textContent='Time remaining: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)finish()}function finish(){if(done)return;done=true;clearInterval(timer);const f=new FormData($('#quiz'));let score=0;questions.forEach((q,i)=>{if(f.get('q'+i)!==null&&Number(f.get('q'+i))===q.a)score++});$('#test').hidden=true;const h=document.createElement('h2');h.textContent='Your score: '+score+' / '+questions.length;$('#result').append(h);questions.forEach((q,i)=>{const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p');h.textContent=(i+1)+'. '+q.q;p.textContent='Correct answer: '+q.o[q.a]+'. '+q.e;a.append(h,p);$('#result').append(a)})}$('#submit').onclick=()=>{if(confirm('Submit your answers?'))finish()};
</script></body></html>
